name: Check the data

# the tests of the scripts and the quality checks of the data files, on every change of them (also pull requests from other people)
on:
  pull_request:
    paths: ['**.csv', 'scripts/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['**.csv', 'scripts/**']
  schedule:
    - cron: '17 4 * * 1'   # weekly: stale rows show up as warnings even when nothing changed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests of the scripts
        run: python3 scripts/test_ingest.py
      - name: Data checks (errors fail, warnings are listed)
        run: python3 scripts/check_data.py --stale-months 18
