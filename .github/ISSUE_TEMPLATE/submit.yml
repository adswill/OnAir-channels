name: Submit a scan
description: Share the channels your OnAir scan found, or where a DAB transmitter stands. OnAir fills this in for you.
title: "[submit] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        This form is normally opened by the OnAir app with the text already filled in. Check it, then press **Submit new issue**.
        GitHub shows your GitHub user name on the issue. A bot adds the channels to the list and closes the issue.
        By submitting you place the channel data in the public domain (CC0 1.0).
  - type: textarea
    id: data
    attributes:
      label: Scan result
      description: Lines "mode:", "country:", "city:" (not for dab-tii) and a csv block. For a DAB transmitter, fill in lat, lon and site. Do not add anything else.
    validations:
      required: true
